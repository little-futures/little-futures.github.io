name: Weekly Discord brief

on:
  schedule:
    # Monday 14:00 UTC (~9am Eastern during EDT, 10am during EST).
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      window:
        description: "Window for the brief (e.g. 7d, 14d, 30d)"
        required: false
        default: "7d"

permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post brief to Discord
        env:
          DISCORD_BRIEFING_WEBHOOK: ${{ secrets.DISCORD_BRIEFING_WEBHOOK }}
        run: ./scripts/brief.sh "${{ inputs.window || '7d' }}"
